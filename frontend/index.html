<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Decision Voting Platform</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Decision Voting Platform</h1>
  <button id="connectBtn">Connect Wallet</button>

  <!-- Part 1: wallet info -->
  <h2>My Wallet</h2>
  <p>Address: <span id="walletAddress">Not connected</span></p>
  <p>Network: <span id="walletNetwork">-</span></p>
  <p>Balance: <span id="walletBalance">-</span></p>

  <!-- Part 2: session info + options -->
  <h2>Voting Session</h2>
  <p>My role: <span id="userRole">-</span></p>
  <p>Status: <span id="sessionState">-</span></p>
  <p>Topic: <span id="sessionTopic">-</span></p>
  <p>Options:</p>
  <ul id="optionsList"></ul>

  <!-- Part 3: admin panel -->
  <h2>Admin Panel</h2>

  <h3>Prepare / Reset Voting Round</h3>
  <input type="text" id="topicInput" placeholder="Voting topic">
  <div id="optionInputs">
    <input type="text" class="optionField" placeholder="Option 1">
    <input type="text" class="optionField" placeholder="Option 2">
  </div>
  <button id="addOptionBtn" type="button">+ Add option</button><br>
  <button id="prepareRoundBtn">Prepare Round</button>
  <p class="warning" id="prepareRoundWarning"></p>

  <h3>Voter Eligibility</h3>
  <input type="text" id="eligibilityAddress" placeholder="Participant wallet address">
  <button id="excludeBtn">Exclude</button>
  <button id="reinstateBtn">Reinstate</button>
  <p class="warning" id="eligibilityWarning"></p>
  <button id="viewExcludedBtn">View Excluded List</button>
  <ul id="excludedList"></ul>

  <h3>Check a Participant's Status</h3>
  <input type="text" id="statusAddress" placeholder="Participant wallet address">
  <button id="checkStatusBtn">Check Status</button>
  <p id="statusResult"></p>

  <h3>End Voting</h3>
  <button id="endRoundBtn">End Round</button>
  <p class="warning" id="endRoundWarning"></p>

  <h3>Reveal Results</h3>
  <button id="revealResultsBtn">Reveal Results</button>
  <p class="warning" id="revealResultsWarning"></p>

  <!-- TODO Part 4: participant panel (cast vote, my status) -->
  <!-- TODO Part 5: results panel -->
  <!-- TODO Part 6: participant-side warnings -->

  <script src="web3.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
