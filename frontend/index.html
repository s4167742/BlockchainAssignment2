  <h1>Decision Voting Platform</h1>
  <button id="connectBtn">Connect Wallet</button>

  <!-- Part 1: wallet info -->

  <p>Address: <span id="walletAddress">Not connected</span></p>
  <p>Network: <span id="walletNetwork">-</span></p>
  <p>Balance: <span id="walletBalance">-</span></p>

  <!-- Part 2: session info + options -->
  <h2>Voting Session</h2>
  <p>My role: <span id="userRole">-</span></p>
  <p>Status: <span id="sessionState">-</span></p>
  <p>Topic: <span id="sessionTopic">-</span></p>
  <p>Options:</p>
